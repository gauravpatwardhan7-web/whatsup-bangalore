name: Weekly newsletter

# Every Thursday at 03:30 UTC (~09:00 IST): curated weekend guide to all users.
# Needs RESEND_API_KEY, plus NEWSLETTER_FROM pointing at a domain you have
# verified at resend.com/domains — Resend's default onboarding@resend.dev sender
# can only deliver to the Resend account owner, so sends to subscribers 403.
# Without RESEND_API_KEY the run is a harmless dry run.
on:
  schedule:
    - cron: "30 3 * * 4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the email without sending"
        type: boolean
        default: false
      test_to:
        description: "Send only to this address (comma-separated) instead of all users"
        type: string
        default: ""

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Send newsletter
        run: npm run newsletter ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '-- --dry-run' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEWSLETTER_FROM: ${{ secrets.NEWSLETTER_FROM }}
          NEWSLETTER_TEST_TO: ${{ inputs.test_to }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
